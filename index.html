<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="デンタ君">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f2733">
<title>デンタ君</title>
<style>
  :root{
    --bg:#0f141b; --panel:#1f2733; --panel2:#262f3d; --line:#333f52;
    --txt:#f2f5f9; --sub:#93a1b5; --accent:#ff9500; --blue:#3a86ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;}
  .app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding:24px 18px;}
  h1{font-size:22px;margin:0 0 4px;font-weight:800;display:flex;align-items:center;gap:10px;}
  h1 .logo{background:var(--accent);color:#1a1a1a;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-size:19px;font-weight:800;}
  .sub{color:var(--sub);font-size:13px;margin:0 0 28px;padding-left:44px;}
  .cards{display:flex;flex-direction:column;gap:16px;}
  a.card{
    text-decoration:none;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:22px 20px;display:flex;align-items:center;gap:16px;
    box-shadow:0 4px 16px rgba(0,0,0,.25);transition:filter .1s,transform .05s;
  }
  a.card:active{filter:brightness(1.2);transform:scale(.98);}
  .card .icon{font-size:30px;width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .card.calc .icon{background:#2a2416;}
  .card.grad .icon{background:#152438;}
  .card .txt h2{margin:0 0 4px;font-size:16px;font-weight:700;}
  .card .txt p{margin:0;font-size:12px;color:var(--sub);line-height:1.5;}
  footer{margin-top:auto;text-align:center;color:#4a5568;font-size:11px;padding-top:24px;}
</style>
</head>
<body>
<div class="app">
  <h1><span class="logo">電</span>デンタ君</h1>
  <p class="sub">使う電卓を選んでください</p>

  <div class="cards">
    <a class="card calc" href="calc.html">
      <div class="icon">🧮</div>
      <div class="txt">
        <h2>ノーマル電卓</h2>
        <p>途中式が消えない電卓。答えを保存・名前付け・合計・ドラッグ挿入ができます。</p>
      </div>
    </a>
    <a class="card grad" href="gradient.html">
      <div class="icon">📐</div>
      <div class="txt">
        <h2>勾配伸び率電卓</h2>
        <p>0.5寸〜12.5寸の勾配を選んで、流れ・隅棟の長さを一度に計算・保存できます。</p>
      </div>
    </a>
  </div>

  <footer>圏外でも使えます（一度オンラインで開いてください）</footer>
</div>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
